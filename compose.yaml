services:
  colota-receiver:
    build: .
    container_name: colota-receiver
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8765}:8000"
    environment:
      APP_USERNAME: "${APP_USERNAME:?Run ./setup.sh first}"
      APP_PASSWORD: "${APP_PASSWORD:?Run ./setup.sh first}"
      INGEST_TOKEN: "${INGEST_TOKEN:?Run ./setup.sh first}"
      APP_TZ: "${APP_TZ:-America/New_York}"
      DATA_DIR: /data
      MAX_GAP_MINUTES: "${MAX_GAP_MINUTES:-20}"
      EXIT_GRACE_MINUTES: "${EXIT_GRACE_MINUTES:-5}"
      MIN_INSIDE_SAMPLES: "${MIN_INSIDE_SAMPLES:-2}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
